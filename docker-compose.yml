name: influx_ts_editor
services:
  influx_ts_editor:
    container_name: influx_ts_editor
    build: .
    image: signag/influx_ts_editor
    network_mode: "host"
    ports:
      - "8087:8087"
    volumes:
      # Persist connection settings across container restarts
      - influx_ts_editor-data:/data
    environment:
      - SETTINGS_FILE=/data/settings.json
      - LOG_LEVEL=ERROR
    restart: unless-stopped
    privileged: true
    
volumes:
  influx_ts_editor-data: